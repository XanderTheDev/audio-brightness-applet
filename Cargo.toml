[package]
name = "audio-brightness-applet"
version = "1.0.1"
edition = "2021"
description = "A small GTK4 layer-shell popup for audio and brightness control"
license = "BSD-4-Clause"

[[bin]]
name = "audio-brightness-applet"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
glib = "0.22"
gtk4 = "0.11"
gtk4-layer-shell = "0.8"
libpulse-binding = "2.28"
libpulse-glib-binding = "2.27"
once_cell = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
